{% extends "base.html" %}

{% block content %}
<section class="form-panel">
    <div class="section-heading">
        <h2>Ask a Question</h2>
        <p>Share your doubt with the community in a simple format.</p>
    </div>

    <form method="POST" class="main-form">
        <label>Question Title</label>
        <input type="text" name="title" placeholder="Enter question title" required>

        <label>Description</label>
        <textarea name="description" rows="6" placeholder="Write your question in detail" required></textarea>

        <label>Category</label>
        <select name="category_id" required>
            <option value="">Select category</option>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-primary">Post Question</button>
    </form>
</section>
{% endblock %}
